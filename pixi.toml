[workspace]
name = "voxel-io-demo"
version = "0.2.0"
description = "A 3D ellipsoid phantom in NeXus/HDF5 and sharded OME-Zarr"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.2,<3"
h5py = ">=3.12,<4"
zarr = ">=3.1,<4"
matplotlib-base = ">=3.9,<4"
tk = ">=8.6,<9"
scikit-image = ">=0.24,<1"

[tasks]
build = "python demo.py build"
check = "python demo.py check"
bench = "python demo.py bench"
view = "python demo.py view --show"
preview = "python demo.py view"
test = "python -m unittest discover -v"
tiled = "python tiled.py"
experiment = "python experiment.py"
profile-experiment = "python profile_experiment.py"
profile-reads = "python profile_raw_reads.py"
access-patterns = "python access_patterns.py"
read-timeline = "python read_timeline.py"
diagnose-reads = "python diagnose_reads.py"
tune-reads = "python tune_reads.py"
write-matrix = "python write_matrix.py"
